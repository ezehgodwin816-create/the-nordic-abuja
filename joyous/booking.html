<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Book a stay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1115; --card: #1a1e28; --text: #eef1f6; --muted: #8b93a7;
      --accent: #c9a26b; --line: rgba(139,147,167,0.18); --ok: #3ecf8e; --danger: #f07178;
      --safe: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }
    a { color: var(--accent); text-decoration: none; }
    .top { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .top strong { font-size: 15px; }
    .wrap { max-width: 440px; margin: 0 auto; padding: 24px 18px calc(40px + var(--safe)); }
    h1 { font-size: 24px; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    input, select {
      display: block; width: 100%; margin-top: 6px; padding: 12px 14px;
      border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--accent); color: #0f1115; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 8px;
    }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .summary {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 14px; margin-bottom: 20px; font-size: 14px;
    }
    .summary div { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .summary .total { font-weight: 700; font-size: 16px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
    .err { color: var(--danger); font-size: 13px; margin-top: 10px; display: none; }
    .err.show { display: block; }
  </style>
</head>
<body>
  <header class="top">
    <strong id="hotelName">Hotel</strong>
    <a href="index.html">← Back</a>
  </header>
  <div class="wrap">
    <h1>Book a stay</h1>
    <p class="sub" id="hotelLoc"></p>
    <div class="summary" id="summary">
      <div><span>Room</span><span id="sRoom">—</span></div>
      <div><span>Nights</span><span id="sNights">—</span></div>
      <div class="total"><span>Total</span><span id="sTotal">—</span></div>
    </div>
    <form id="form">
      <div class="row">
        <label>Check-in<input type="date" id="checkin" required /></label>
        <label>Check-out<input type="date" id="checkout" required /></label>
      </div>
      <label>Room type<select id="room" required></select></label>
      <label>Guests<input type="number" id="guests" min="1" max="6" value="2" required /></label>
      <div class="row">
        <label>First name<input id="first" required autocomplete="given-name" /></label>
        <label>Last name<input id="last" required autocomplete="family-name" /></label>
      </div>
      <label>Email<input type="email" id="email" required autocomplete="email" /></label>
      <label>Phone<input id="phone" required placeholder="08xx…" autocomplete="tel" /></label>
      <button type="submit" class="btn" id="submitBtn">Create reservation</button>
      <p class="err" id="err"></p>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/booking-engine.js"></script>
  <script>
    window.BOOKING_HOTEL_ID = 'joyous';
    const hotelId = window.BOOKING_HOTEL_ID;
    const hotel = NordicBooking.getHotel(hotelId);
    document.getElementById('hotelName').textContent = hotel.name;
    document.getElementById('hotelLoc').textContent = hotel.location;
    document.title = 'Book · ' + hotel.name;
    const roomSel = document.getElementById('room');
    hotel.rooms.forEach(r => {
      const o = document.createElement('option');
      o.value = r.id;
      o.textContent = r.name + ' — from ₦' + r.price.toLocaleString('en-NG') + '/night';
      roomSel.appendChild(o);
    });
    const today = new Date().toISOString().slice(0, 10);
    const cin = document.getElementById('checkin');
    const cout = document.getElementById('checkout');
    cin.min = today; cout.min = today; cin.value = today;
    const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
    cout.value = tmr.toISOString().slice(0, 10);
    function updateSummary() {
      const room = hotel.rooms.find(r => r.id === roomSel.value) || hotel.rooms[0];
      const nights = NordicBooking.nightsBetween(cin.value, cout.value);
      document.getElementById('sRoom').textContent = room.name;
      document.getElementById('sNights').textContent = nights || '—';
      document.getElementById('sTotal').textContent = nights ? NordicBooking.money(room.price * nights) : '—';
    }
    [cin, cout, roomSel].forEach(el => el.addEventListener('change', updateSummary));
    updateSummary();
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.classList.remove('show');
      const btn = document.getElementById('submitBtn');
      btn.disabled = true; btn.textContent = 'Creating…';
      try {
        await NordicBooking.createBooking({
          hotel_id: hotelId,
          check_in: cin.value, check_out: cout.value,
          room_type: roomSel.value,
          guests: Number(document.getElementById('guests').value),
          first_name: document.getElementById('first').value.trim(),
          last_name: document.getElementById('last').value.trim(),
          email: document.getElementById('email').value.trim(),
          phone: document.getElementById('phone').value.trim()
        });
        location.href = 'booking-success.html';
      } catch (ex) {
        err.textContent = ex.message || 'Could not create booking.';
        err.classList.add('show');
        btn.disabled = false; btn.textContent = 'Create reservation';
      }
    };
  </script>
</body>
</html>
