<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events · Joyous Hotel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; background: #0f1115; color: #eef1f6; margin: 0; padding: 20px; max-width: 560px; }
    a { color: #c9a26b; } h1 { font-size: 24px; } .sub { color: #8b93a7; margin-bottom: 20px; }
    .empty { text-align: center; padding: 40px 16px; border: 1px dashed rgba(139,147,167,0.2); border-radius: 14px; color: #8b93a7; }
    .card { background: #1a1e28; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid rgba(139,147,167,0.15); }
  </style>
</head>
<body>
  <p><a href="index.html">← Back</a></p>
  <h1>Events</h1>
  <p class="sub">Joyous Hotel</p>
  <div id="list"></div>
  <script>
    const E = JSON.parse(localStorage.getItem('nordic_events_joyous') || '[]');
    const list = document.getElementById('list');
    if (!E.length) {
      list.innerHTML = '<div class="empty"><p><strong>No available events</strong></p><p style="font-size:13px;margin-top:6px">When the hotel adds programmes, they show here.</p></div>';
    } else {
      list.innerHTML = E.map(e => '<div class="card"><strong>'+e.title+'</strong><div style="color:#8b93a7;font-size:13px;margin-top:4px">'+e.date+'</div><p style="margin-top:8px;font-size:14px">'+(e.detail||'')+'</p></div>').join('');
    }
  </script>
</body>
</html>
