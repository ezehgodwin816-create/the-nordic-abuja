<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hotel Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#0f1115; --surf:#171a21; --card:#1e232d; --text:#eef1f6; --muted:#8b93a7;
      --accent:#6c8cff; --ok:#3ecf8e; --warn:#f0b429; --danger:#f07178; --line:rgba(139,147,167,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }
    button, input, select, textarea { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
    #login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    .login-card { width: 100%; max-width: 360px; background: var(--surf); border-radius: 16px; padding: 28px; border: 1px solid var(--line); }
    .login-card h1 { font-size: 18px; margin-bottom: 4px; }
    .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .login-card label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .login-card input { display: block; width: 100%; margin-top: 6px; padding: 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
    .login-card button { width: 100%; padding: 12px; border-radius: 10px; margin-top: 8px; background: var(--accent); color: #0f1115; font-weight: 600; }
    .err { color: var(--danger); font-size: 13px; margin-top: 8px; }
    #app { display: none; }
    #app.show { display: block; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--surf); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
    .layout { display: flex; min-height: calc(100dvh - 52px); }
    .side { width: 200px; background: var(--surf); border-right: 1px solid var(--line); padding: 12px; flex-shrink: 0; }
    .side button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 2px; }
    .side button.active, .side button:hover { background: var(--card); color: var(--accent); }
    .main { flex: 1; padding: 18px; overflow: auto; }
    .main h1 { font-size: 20px; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .stat { background: var(--card); border-radius: 12px; padding: 14px; border: 1px solid var(--line); }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 11px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 11px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.ok { background: rgba(62,207,142,0.15); color: var(--ok); }
    .badge.warn { background: rgba(240,180,41,0.15); color: var(--warn); }
    .badge.danger { background: rgba(240,113,120,0.15); color: var(--danger); }
    .btn { padding: 8px 12px; border-radius: 8px; background: var(--accent); color: #0f1115; font-weight: 600; font-size: 12px; }
    .btn.ghost { background: var(--card); color: var(--text); }
    .empty { text-align: center; padding: 32px; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; font-size: 14px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; place-items: center; z-index: 50; padding: 16px; }
    .modal.show { display: grid; }
    .modal-box { background: var(--surf); border-radius: 14px; padding: 20px; max-width: 420px; width: 100%; border: 1px solid var(--line); }
    .modal-box textarea { width: 100%; min-height: 80px; padding: 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); margin: 10px 0; }
    @media (max-width: 700px) { .side { display: none; } .side.open { display: block; position: fixed; inset: 0; z-index: 20; width: 100%; } }
  </style>
  <script src="../shared/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/auth.js"></script>
</head>
<body>
  <div id="login">
    <div class="login-card">
      <h1 id="loginTitle">Hotel Admin</h1>
      <p>Staff login for this hotel only</p>
      <form id="loginForm">
        <label>Email<input type="email" id="email" required /></label>
        <label>Password<input type="password" id="password" required /></label>
        <button type="submit">Sign in</button>
        <div class="err" id="loginErr"></div>
      </form>
      <p style="margin-top:12px;font-size:12px;color:var(--muted)">Demo: admin.joyous@nordic.ng / admin123 (or admin.annex / admin.jimmy)</p>
    </div>
  </div>

  <div id="app">
    <header class="top">
      <div><strong id="hotelTitle">Admin</strong></div>
      <div>
        <button type="button" id="menuBtn" class="btn ghost" style="margin-right:6px">Menu</button>
        <button type="button" id="logout" class="btn ghost">Sign out</button>
      </div>
    </header>
    <div class="layout">
      <aside class="side" id="side">
        <button data-v="dashboard" class="active">Dashboard</button>
        <button data-v="bookings">Bookings</button>
        <button data-v="staff">Staff applications</button>
        <button data-v="team">Active staff</button>
        <button data-v="reports">Guest reports</button>
        <button data-v="events">Events</button>
        <button data-v="promos">Promos</button>
      </aside>
      <main class="main" id="main"></main>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h3 id="modalTitle">Reply</h3>
      <textarea id="modalText" placeholder="Your reply to the guest…"></textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn ghost" type="button" id="modalCancel">Cancel</button>
        <button class="btn" type="button" id="modalOk">Send reply</button>
      </div>
    </div>
  </div>

  <script src="../shared/js/config.js"></script>
  <script>
    // Set before load: window.ADMIN_HOTEL_ID = 'joyous' | 'dj-annex' | 'jimmyland'
    const hotelId = window.ADMIN_HOTEL_ID || new URLSearchParams(location.search).get('hotel') || 'joyous';
    const hotel = (window.NORDIC_CONFIG && window.NORDIC_CONFIG.hotels[hotelId]) || { name: hotelId, id: hotelId };
    document.getElementById('loginTitle').textContent = hotel.name + ' Admin';
    document.getElementById('hotelTitle').textContent = hotel.name + ' · Admin';
    document.title = hotel.name + ' Admin';

    const $ = id => document.getElementById(id);
    const main = $('main');
    let replyTarget = null;

    $('loginForm').onsubmit = async e => {
      e.preventDefault();
      const email = $('email').value.trim();
      const pass = $('password').value;
      $('loginErr').textContent = 'Signing in via Supabase...';
      try {
        const r = await NordicAuth.login(email, pass, 'admin');
        if (!r.ok) {
          $('loginErr').textContent = r.error || 'Invalid admin login.';
          return;
        }
        if (!r.session.isAdmin && r.session.role !== 'admin' && r.session.role !== 'super') {
          await NordicAuth.logout();
          $('loginErr').textContent = 'Not an administrator in staff_profiles.';
          return;
        }
        $('login').style.display = 'none';
        $('app').classList.add('show');
        render('dashboard');
      } catch (err) {
        $('loginErr').textContent = err.message || 'Login error';
      }
    };
    $('logout').onclick = async () => {
      await NordicAuth.logout();
      location.reload();
    };
    $('menuBtn').onclick = () => $('side').classList.toggle('open');
    document.querySelectorAll('#side button').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#side button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        $('side').classList.remove('open');
        render(b.dataset.v);
      };
    });

    function bookings() {
      return JSON.parse(localStorage.getItem('nordic_bookings_' + hotelId) || '[]');
    }
    function pendingStaff() {
      return JSON.parse(localStorage.getItem('nordic_staff_pending') || '[]').filter(s => s.hotel_id === hotelId);
    }
    function activeStaff() {
      return JSON.parse(localStorage.getItem('nordic_staff_active') || '[]').filter(s => s.hotel_id === hotelId);
    }
    function reports() {
      return JSON.parse(localStorage.getItem('nordic_reports') || '[]').filter(r => r.hotel === hotelId || (r.hotel && r.hotel.includes(hotel.name.split(' ')[0])));
    }
    function events() {
      return JSON.parse(localStorage.getItem('nordic_events_' + hotelId) || '[]');
    }
    function promos() {
      return JSON.parse(localStorage.getItem('nordic_promos') || '[]').filter(p => !p.hotel_id || p.hotel_id === hotelId);
    }
    function badge(s) {
      const m = { paid: 'ok', confirmed: 'ok', approved: 'ok', pending: 'warn', unpaid: 'warn', open: 'warn', rejected: 'danger' };
      return `<span class="badge ${m[s] || ''}">${s || '—'}</span>`;
    }

    function render(view) {
      if (view === 'dashboard') {
        const B = bookings(), P = pendingStaff(), R = reports().filter(r => r.status === 'open');
        main.innerHTML = `
          <h1>Dashboard</h1>
          <p class="sub">${hotel.name} · ${hotel.location || ''}</p>
          <div class="stats">
            <div class="stat"><b>${B.length}</b><span>Bookings</span></div>
            <div class="stat"><b>${B.filter(b=>b.payment_status==='paid').length}</b><span>Paid</span></div>
            <div class="stat"><b>${P.length}</b><span>Staff pending</span></div>
            <div class="stat"><b>${R.length}</b><span>Open reports</span></div>
          </div>
          <p class="sub">Data is stored locally for demo until Supabase multi-hotel tables are connected. Bookings created on this hotel’s site appear here.</p>
        `;
      } else if (view === 'bookings') {
        const B = bookings();
        main.innerHTML = `
          <h1>Bookings</h1>
          <p class="sub">Reservations for ${hotel.name}</p>
          ${B.length === 0 ? '<div class="empty">No bookings yet. Guests book from the hotel website.</div>' : `
          <table>
            <thead><tr><th>Ref</th><th>Guest</th><th>Dates</th><th>Room</th><th>Status</th><th>Pay</th></tr></thead>
            <tbody>
              ${B.map(b => `<tr>
                <td>${b.booking_reference}</td>
                <td>${b.guest_first_name} ${b.guest_last_name}</td>
                <td>${b.check_in} → ${b.check_out}</td>
                <td>${b.room_name || b.room_type}</td>
                <td>${badge(b.status)}</td>
                <td>${badge(b.payment_status)}</td>
              </tr>`).join('')}
            </tbody>
          </table>`}
        `;
      } else if (view === 'staff') {
        const P = pendingStaff();
        main.innerHTML = `
          <h1>Staff applications</h1>
          <p class="sub">KYC applications waiting for approval</p>
          ${P.length === 0 ? '<div class="empty">No pending applications. Staff apply at shared/staff-apply.html</div>' : `
          <table>
            <thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>ID</th><th>Date</th><th></th></tr></thead>
            <tbody>
              ${P.map((s, i) => `<tr>
                <td>${s.name}</td>
                <td>${s.role}</td>
                <td>${s.phone}</td>
                <td>${s.id_type}: ${s.id_number}</td>
                <td>${s.date}</td>
                <td>
                  <button class="btn" onclick="approveStaff('${s.id}')">Approve</button>
                  <button class="btn ghost" onclick="rejectStaff('${s.id}')">Reject</button>
                </td>
              </tr>`).join('')}
            </tbody>
          </table>`}
        `;
      } else if (view === 'team') {
        const T = activeStaff();
        main.innerHTML = `
          <h1>Active staff</h1>
          <p class="sub">Approved team members</p>
          ${T.length === 0 ? '<div class="empty">No active staff yet.</div>' : `
          <table>
            <thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Status</th></tr></thead>
            <tbody>
              ${T.map(s => `<tr><td>${s.name}</td><td>${s.role}</td><td>${s.phone}</td><td>${badge(s.status)}</td></tr>`).join('')}
            </tbody>
          </table>`}
        `;
      } else if (view === 'reports') {
        const R = JSON.parse(localStorage.getItem('nordic_reports') || '[]').filter(r =>
          r.hotel === hotelId || (r.hotel && String(r.hotel).toLowerCase().includes(hotelId.split('-')[0]))
        );
        main.innerHTML = `
          <h1>Guest reports</h1>
          <p class="sub">Complaints and issues for this hotel</p>
          ${R.length === 0 ? '<div class="empty">No reports yet.</div>' : `
          <table>
            <thead><tr><th>Guest</th><th>Subject</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${R.map((r, i) => `<tr>
                <td>${r.name}<br><span style="color:var(--muted);font-size:11px">${r.contact}</span></td>
                <td>${r.subject}<br><span style="color:var(--muted);font-size:11px">${(r.details||'').slice(0,60)}…</span></td>
                <td>${badge(r.status)}</td>
                <td><button class="btn ghost" onclick="openReply(${JSON.stringify(r).replace(/"/g, '&quot;')})">Reply</button></td>
              </tr>`).join('')}
            </tbody>
          </table>`}
        `;
      } else if (view === 'events') {
        const E = events();
        main.innerHTML = `
          <h1>Events</h1>
          <p class="sub">Add programmes that show on the hotel site</p>
          <button class="btn" onclick="addEvent()">+ Add event</button>
          <div style="margin-top:16px">
            ${E.length === 0 ? '<div class="empty">No events yet.</div>' : E.map(ev => `
              <div style="background:var(--card);padding:12px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line)">
                <strong>${ev.title}</strong>
                <div style="color:var(--muted);font-size:13px">${ev.date} · ${ev.detail || ''}</div>
              </div>
            `).join('')}
          </div>
        `;
      } else if (view === 'promos') {
        const P = promos();
        main.innerHTML = `
          <h1>Promos</h1>
          <p class="sub">Discounts shown to guests</p>
          <button class="btn" onclick="addPromo()">+ Add promo</button>
          <div style="margin-top:16px">
            ${P.length === 0 ? '<div class="empty">No promos yet.</div>' : P.map(p => `
              <div style="background:var(--card);padding:12px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line)">
                <strong>${p.title}</strong>
                <div style="color:var(--muted);font-size:13px">${p.detail || ''}</div>
              </div>
            `).join('')}
          </div>
        `;
      }
    }

    window.approveStaff = function (id) {
      let pending = JSON.parse(localStorage.getItem('nordic_staff_pending') || '[]');
      const idx = pending.findIndex(s => s.id === id);
      if (idx < 0) return;
      const s = pending.splice(idx, 1)[0];
      s.status = 'approved';
      localStorage.setItem('nordic_staff_pending', JSON.stringify(pending));
      const active = JSON.parse(localStorage.getItem('nordic_staff_active') || '[]');
      active.unshift(s);
      localStorage.setItem('nordic_staff_active', JSON.stringify(active));
      render('staff');
    };
    window.rejectStaff = function (id) {
      let pending = JSON.parse(localStorage.getItem('nordic_staff_pending') || '[]');
      pending = pending.filter(s => s.id !== id);
      localStorage.setItem('nordic_staff_pending', JSON.stringify(pending));
      render('staff');
    };
    window.openReply = function (r) {
      replyTarget = r;
      $('modalTitle').textContent = 'Reply to ' + (r.name || 'guest');
      $('modalText').value = '';
      $('modal').classList.add('show');
    };
    $('modalCancel').onclick = () => $('modal').classList.remove('show');
    $('modalOk').onclick = () => {
      const text = $('modalText').value.trim();
      if (!text || !replyTarget) return;
      const all = JSON.parse(localStorage.getItem('nordic_reports') || '[]');
      const i = all.findIndex(x => x.date === replyTarget.date && x.contact === replyTarget.contact && x.subject === replyTarget.subject);
      if (i >= 0) {
        all[i].admin_reply = text;
        all[i].status = 'resolved';
        localStorage.setItem('nordic_reports', JSON.stringify(all));
      }
      const notes = JSON.parse(localStorage.getItem('nordic_notifications') || '[]');
      notes.unshift({
        to: replyTarget.contact,
        title: 'Reply to your report',
        body: text,
        date: new Date().toISOString().slice(0, 10)
      });
      localStorage.setItem('nordic_notifications', JSON.stringify(notes));
      $('modal').classList.remove('show');
      render('reports');
    };
    window.addEvent = function () {
      const title = prompt('Event title');
      if (!title) return;
      const date = prompt('Date (YYYY-MM-DD)', new Date().toISOString().slice(0, 10));
      const detail = prompt('Short description') || '';
      const E = events();
      E.unshift({ title, date, detail });
      localStorage.setItem('nordic_events_' + hotelId, JSON.stringify(E));
      render('events');
    };
    window.addPromo = function () {
      const title = prompt('Promo title');
      if (!title) return;
      const detail = prompt('Details') || '';
      const P = JSON.parse(localStorage.getItem('nordic_promos') || '[]');
      P.unshift({ title, detail, hotel_id: hotelId, hotel: hotel.name });
      localStorage.setItem('nordic_promos', JSON.stringify(P));
      render('promos');
    };
  </script>
</body>
</html>
