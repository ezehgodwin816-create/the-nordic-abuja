<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Central Command · Nordic Group</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0f1115; --surf:#171a21; --card:#1e232d; --text:#eef1f6; --muted:#8b93a7; --accent:#6c8cff; --ok:#3ecf8e; --warn:#f0b429; --danger:#f07178; --line:rgba(139,147,167,0.15); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; }
    button, input { font: inherit; color: inherit; border: none; background: none; cursor: pointer; }
    a { color: var(--accent); text-decoration: none; }
    #login { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    .login-card { width: 100%; max-width: 380px; background: var(--surf); border-radius: 16px; padding: 28px; border: 1px solid var(--line); }
    .login-card h1 { font-size: 20px; margin-bottom: 4px; }
    .login-card p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .login-card label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .login-card input { display: block; width: 100%; margin-top: 6px; padding: 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); }
    .login-card button { width: 100%; padding: 12px; border-radius: 10px; margin-top: 8px; background: var(--accent); color: #0f1115; font-weight: 600; }
    .err { color: var(--danger); font-size: 13px; margin-top: 10px; }
    #app { display: none; } #app.show { display: block; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--surf); position: sticky; top: 0; z-index: 20; }
    .layout { display: flex; min-height: calc(100dvh - 56px); }
    .side { width: 220px; background: var(--surf); border-right: 1px solid var(--line); padding: 16px 12px; flex-shrink: 0; }
    .side button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 2px; }
    .side button.active, .side button:hover { background: var(--card); color: var(--accent); }
    .main { flex: 1; padding: 20px; overflow: auto; }
    .main h1 { font-size: 22px; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid var(--line); }
    .stat b { display: block; font-size: 22px; }
    .stat span { font-size: 12px; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge.ok { background: rgba(62,207,142,0.15); color: var(--ok); }
    .badge.warn { background: rgba(240,180,41,0.15); color: var(--warn); }
    .badge.danger { background: rgba(240,113,120,0.15); color: var(--danger); }
    .btn { padding: 8px 14px; border-radius: 8px; background: var(--accent); color: #0f1115; font-weight: 600; font-size: 13px; }
    .btn.ghost { background: var(--card); color: var(--text); }
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; background: var(--card); border-radius: 12px; border: 1px dashed var(--line); }
    .hotel-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .hotel-tabs button { padding: 8px 14px; border-radius: 8px; background: var(--card); font-size: 13px; }
    .hotel-tabs button.on { background: var(--accent); color: #0f1115; font-weight: 600; }
    @media (max-width: 720px) { .side { display: none; } .side.mobile-open { display: flex; flex-direction: column; position: fixed; inset: 0; z-index: 30; width: 100%; } }
  </style>
  <script src="../shared/js/auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/js/config.js"></script>
  <script src="../shared/js/auth.js"></script>
</head>
<body>
  <div id="login">
    <div class="login-card">
      <h1>Central Command</h1>
      <p>Nordic Group · All hotels, all data</p>
      <form id="loginForm">
        <label>Email<input type="email" id="email" required /></label>
        <label>Password<input type="password" id="password" required /></label>
        <button type="submit">Sign in</button>
        <div class="err" id="loginErr"></div>
      </form>
      <p style="margin-top:16px;font-size:12px;color:var(--muted)">Uses Supabase Auth + staff_profiles (super_admin / is_admin_user)</p>
    </div>
  </div>
  <div id="app">
    <header class="top">
      <div><strong>Central Command</strong> <span id="who" style="color:var(--muted);font-size:13px;margin-left:8px"></span></div>
      <div>
        <button type="button" id="menuMobile" class="btn ghost" style="margin-right:8px">Menu</button>
        <button type="button" id="logout" class="btn ghost">Sign out</button>
      </div>
    </header>
    <div class="layout">
      <aside class="side" id="side">
        <button data-v="dashboard" class="active">Dashboard</button>
        <button data-v="hotels">Hotels</button>
        <button data-v="bookings">All bookings</button>
        <button data-v="staff">Staff applications</button>
        <button data-v="team">All staff</button>
        <button data-v="reports">Guest reports</button>
        <button data-v="payments">Payments</button>
        <button data-v="promos">Promos</button>
      </aside>
      <main class="main" id="main"></main>
    </div>
  </div>
  <script>
    const HOTELS = [
      { id: 'joyous', name: 'Joyous Hotel', location: 'Nyanya', path: '../joyous/' },
      { id: 'dj-annex', name: 'DJ Annex Hotel', location: 'Abacha Road', path: '../dj-annex/' },
      { id: 'jimmyland', name: 'Jimmyland Hotel', location: 'Abacha Road, Mararaba', path: '../jimmyland/' }
    ];
    let filterHotel = 'all';
    const $ = id => document.getElementById(id);
    const main = $('main');
    $('loginForm').onsubmit = async e => {
      e.preventDefault();
      $('loginErr').textContent = 'Signing in...';
      const r = await NordicAuth.login($('email').value, $('password').value, 'super');
      if (!r.ok) {
        $('loginErr').textContent = r.error || 'Central Command login failed.';
        return;
      }
      if (!r.session.isAdmin && r.session.role !== 'super') {
        await NordicAuth.logout();
        $('loginErr').textContent = 'Not authorised for Central Command.';
        return;
      }
      if (false) {
        $('loginErr').textContent = 'Invalid email or password.';
        return;
      }
      $('login').style.display = 'none';
      $('app').classList.add('show');
      $('who').textContent = $('email').value.trim();
      render('dashboard');
    };
    $('logout').onclick = () => location.reload();
    document.querySelectorAll('#side button').forEach(b => {
      b.onclick = () => {
        document.querySelectorAll('#side button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        $('side').classList.remove('mobile-open');
        render(b.dataset.v);
      };
    });
    $('menuMobile').onclick = () => $('side').classList.toggle('mobile-open');
    function allBookings() { return JSON.parse(localStorage.getItem('nordic_bookings_all') || '[]'); }
    function pendingStaff() { return JSON.parse(localStorage.getItem('nordic_staff_pending') || '[]'); }
    function activeStaff() { return JSON.parse(localStorage.getItem('nordic_staff_active') || '[]'); }
    function allReports() { return JSON.parse(localStorage.getItem('nordic_reports') || '[]'); }
    function allPromos() { return JSON.parse(localStorage.getItem('nordic_promos') || '[]'); }
    function money(n) { return '₦' + Number(n || 0).toLocaleString('en-NG'); }
    function badge(s) {
      const m = { paid: 'ok', confirmed: 'ok', approved: 'ok', pending: 'warn', unpaid: 'warn', open: 'warn', rejected: 'danger', resolved: 'ok' };
      return '<span class="badge ' + (m[s] || '') + '">' + (s || '—') + '</span>';
    }
    function hotelFilter() {
      return '<div class="hotel-tabs"><button class="' + (filterHotel==='all'?'on':'') + '" data-h="all">All</button>' +
        HOTELS.map(h => '<button class="' + (filterHotel===h.id?'on':'') + '" data-h="' + h.id + '">' + h.name + '</button>').join('') + '</div>';
    }
    function render(view) {
      if (view === 'dashboard') {
        const B = allBookings(), P = pendingStaff(), R = allReports().filter(r => r.status === 'open');
        const paid = B.filter(b => b.payment_status === 'paid').reduce((s, b) => s + Number(b.total_amount || 0), 0);
        main.innerHTML = '<h1>Dashboard</h1><p class="sub">Joyous, DJ Annex and Jimmyland</p><div class="stats">' +
          '<div class="stat"><b>3</b><span>Hotels</span></div><div class="stat"><b>' + B.length + '</b><span>Bookings</span></div>' +
          '<div class="stat"><b>' + money(paid) + '</b><span>Paid total</span></div><div class="stat"><b>' + P.length + '</b><span>Staff pending</span></div>' +
          '<div class="stat"><b>' + activeStaff().length + '</b><span>Active staff</span></div><div class="stat"><b>' + R.length + '</b><span>Open reports</span></div></div>' +
          '<p class="sub">Book on any hotel site, apply as staff, or send a report — data shows here (localStorage demo; same shape for Supabase).</p>';
      } else if (view === 'hotels') {
        main.innerHTML = '<h1>Hotels</h1><p class="sub">The Nordic Group</p><div class="stats">' +
          HOTELS.map(h => '<div class="stat" style="min-width:200px"><b style="font-size:16px">' + h.name + '</b><span>' + h.location + '</span>' +
            '<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn ghost" href="' + h.path + 'index.html" target="_blank">Open site</a>' +
            '<a class="btn ghost" href="../admin/' + h.id + '/index.html" target="_blank">Hotel admin</a></div></div>').join('') + '</div>';
      } else if (view === 'bookings') {
        let list = allBookings();
        if (filterHotel !== 'all') list = list.filter(b => b.hotel_id === filterHotel);
        main.innerHTML = '<h1>All bookings</h1><p class="sub">Across every hotel</p>' + hotelFilter() +
          (list.length === 0 ? '<div class="empty">No bookings yet.</div>' :
          '<table><thead><tr><th>Ref</th><th>Hotel</th><th>Guest</th><th>Dates</th><th>Total</th><th>Pay</th></tr></thead><tbody>' +
          list.map(b => '<tr><td>' + b.booking_reference + '</td><td>' + (b.hotel_name || b.hotel_id) + '</td><td>' + b.guest_first_name + ' ' + b.guest_last_name +
            '</td><td>' + b.check_in + ' → ' + b.check_out + '</td><td>' + money(b.total_amount) + '</td><td>' + badge(b.payment_status) + '</td></tr>').join('') +
          '</tbody></table>');
        main.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { filterHotel = b.dataset.h; render('bookings'); });
      } else if (view === 'staff') {
        const list = pendingStaff();
        main.innerHTML = '<h1>Staff applications</h1><p class="sub">Pending KYC (all hotels)</p>' +
          (list.length === 0 ? '<div class="empty">No pending applications.</div>' :
          '<table><thead><tr><th>Name</th><th>Hotel</th><th>Role</th><th>ID</th><th>Date</th><th></th></tr></thead><tbody>' +
          list.map(s => '<tr><td>' + s.name + '<br><span style="color:var(--muted);font-size:11px">' + s.phone + '</span></td><td>' + (s.hotel || s.hotel_id) +
            '</td><td>' + s.role + '</td><td>' + s.id_type + ': ' + s.id_number + '</td><td>' + s.date +
            '</td><td><button class="btn" onclick="approveStaff(\'' + s.id + '\')">Approve</button> <button class="btn ghost" onclick="rejectStaff(\'' + s.id + '\')">Reject</button></td></tr>').join('') +
          '</tbody></table>');
      } else if (view === 'team') {
        const list = activeStaff();
        main.innerHTML = '<h1>All staff</h1><p class="sub">Approved team</p>' +
          (list.length === 0 ? '<div class="empty">No active staff yet.</div>' :
          '<table><thead><tr><th>Name</th><th>Hotel</th><th>Role</th><th>Phone</th><th>Status</th></tr></thead><tbody>' +
          list.map(s => '<tr><td>' + s.name + '</td><td>' + (s.hotel || s.hotel_id) + '</td><td>' + s.role + '</td><td>' + s.phone + '</td><td>' + badge(s.status) + '</td></tr>').join('') +
          '</tbody></table>');
      } else if (view === 'reports') {
        const list = allReports();
        main.innerHTML = '<h1>Guest reports</h1><p class="sub">All hotels</p>' +
          (list.length === 0 ? '<div class="empty">No reports yet.</div>' :
          '<table><thead><tr><th>Guest</th><th>Hotel</th><th>Subject</th><th>Status</th><th>Reply</th></tr></thead><tbody>' +
          list.map(r => '<tr><td>' + r.name + '<br><span style="color:var(--muted);font-size:11px">' + r.contact + '</span></td><td>' + r.hotel +
            '</td><td>' + r.subject + '</td><td>' + badge(r.status) + '</td><td>' + (r.admin_reply ? r.admin_reply.slice(0, 40) + '…' : '—') + '</td></tr>').join('') +
          '</tbody></table>');
      } else if (view === 'payments') {
        const list = allBookings();
        main.innerHTML = '<h1>Payments</h1><p class="sub">From bookings</p>' +
          (list.length === 0 ? '<div class="empty">No records yet.</div>' :
          '<table><thead><tr><th>Ref</th><th>Hotel</th><th>Guest</th><th>Amount</th><th>Status</th></tr></thead><tbody>' +
          list.map(b => '<tr><td>' + b.booking_reference + '</td><td>' + (b.hotel_name || b.hotel_id) + '</td><td>' + b.guest_first_name + ' ' + b.guest_last_name +
            '</td><td>' + money(b.total_amount) + '</td><td>' + badge(b.payment_status) + '</td></tr>').join('') +
          '</tbody></table>');
      } else if (view === 'promos') {
        const list = allPromos();
        main.innerHTML = '<h1>Promos</h1><p class="sub">From hotel admins</p>' +
          (list.length === 0 ? '<div class="empty">No promos yet.</div>' :
          '<table><thead><tr><th>Title</th><th>Hotel</th><th>Detail</th></tr></thead><tbody>' +
          list.map(p => '<tr><td>' + p.title + '</td><td>' + (p.hotel || p.hotel_id || '—') + '</td><td>' + (p.detail || '') + '</td></tr>').join('') +
          '</tbody></table>');
      }
    }
    window.approveStaff = function (id) {
      let pending = pendingStaff();
      const idx = pending.findIndex(s => s.id === id);
      if (idx < 0) return;
      const s = pending.splice(idx, 1)[0];
      s.status = 'approved';
      localStorage.setItem('nordic_staff_pending', JSON.stringify(pending));
      const active = activeStaff();
      active.unshift(s);
      localStorage.setItem('nordic_staff_active', JSON.stringify(active));
      render('staff');
    };
    window.rejectStaff = function (id) {
      localStorage.setItem('nordic_staff_pending', JSON.stringify(pendingStaff().filter(s => s.id !== id)));
      render('staff');
    };
  </script>
</body>
</html>
