<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>The Nordic Abuja — PMS</title>
  <link rel="stylesheet" href="pms.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- Login -->
  <div id="login">
    <div class="login-card">
      <div class="logo">N</div>
      <h1>The Nordic Abuja</h1>
      <p>Property Management System</p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Admin email" required autocomplete="username">
        <input id="password" type="password" placeholder="Password" required autocomplete="current-password">
        <button type="submit">Sign in</button>
        <div id="loginError"></div>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <header>
      <button id="menu" type="button" aria-label="Menu">☰</button>
      <b>THE NORDIC ABUJA</b>
      <span id="who"></span>
      <button id="logout" type="button">Sign out</button>
    </header>

    <aside id="side">
      <button data-v="dashboard" class="active">Dashboard</button>
      <button data-v="frontdesk">Front Desk</button>
      <button data-v="calendar">Calendar</button>
      <button data-v="rooms">Rooms</button>
      <button data-v="guests">Guests & CRM</button>
      <button data-v="housekeeping">Housekeeping</button>
      <button data-v="maintenance">Maintenance</button>
      <button data-v="folios">Folios & Billing</button>
      <button data-v="payments">Payments</button>
      <button data-v="rates">Rates & Promotions</button>
      <button data-v="extras">Extras</button>
      <button data-v="reports">Reports</button>
      <button data-v="staff">Staff & Permissions</button>
      <button data-v="audit">Audit Log</button>
    </aside>

    <main id="main"></main>
  </div>

  <!-- Generic Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">—</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <div id="modalBody"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="pms.js"></script>
</body>
</html>
